name: Releases
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Manual Release: {0}', inputs.manual_tag)
    || format('Release: {0}', github.event.workflow_run.display_title) }}

on:
  # Trigger A: Automatic execution when Main Workflow finishes
  workflow_run:
    workflows: ["Main branch"]
    types:
      - completed
  
  # Trigger B: Manual execution fallback from the GitHub UI
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Tag to release (e.g., v1.2.3)'
        required: true
        type: string
      override_run_id:
        description: 'Main Workflow Run ID (Required if downloading artifacts)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prep-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      is_valid_release: ${{ steps.validate.outputs.is_valid }}
      semver_tag: ${{ steps.validate.outputs.version }}
      target_run_id: ${{ steps.validate.outputs.run_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure uv environment
        uses: ./.github/actions/setup-uv-local
        with:
          python-version: "3.14"

      - name: Validate release conditions
        id: validate
        env:
          # Authentication Token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upstream Workflow Configuration
          # This is the name of the workflow that both manual and automated
          # release validations depend on.
          UPSTREAM_WORKFLOW_NAME: "Main branch"
          # GitHub Context Variables (provided by the workflow_run or workflow_dispatch event)
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          AUTOMATED_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          # Manual Trigger Inputs (from workflow_dispatch)
          MANUAL_RELEASE_TAG: ${{ inputs.manual_tag }}
          MANUAL_UPSTREAM_RUN_ID: ${{ inputs.override_run_id }}
        run: uv run glf-dev release gh-workflow-check

  publish-docs:
    name: Publish Docs
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.semver_tag }}
          fetch-depth: 2
      - name: Download built documentation
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.prep-release.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: docs-site
          path: site
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: site

  publish-to-github:
    name: Publish Release
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore signing and the GitHub attestation store
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.semver_tag }}
      - name: Configure uv environment
        uses: ./.github/actions/setup-uv-local
        with:
          python-version: "3.14"
      # Clean virtualenv with the package and its locked runtime dependencies, so the SBOM
      # covers exactly that set and nothing else
      - name: Install package with runtime dependencies
        run: uv sync --frozen --no-dev --no-editable
      # Version without the "v" tag prefix, like PyPI and Docker. The syft config makes
      # gitlabform the root component of the SBOM instead of the scanned directory.
      - name: Prepare SBOM metadata
        env:
          TAG: ${{ needs.prep-release.outputs.semver_tag }}
        run: |
          VERSION="${TAG#v}"
          echo "SBOM_FILE=gitlabform-${VERSION}.cdx.json" >> "$GITHUB_ENV"
          printf 'source:\n  name: gitlabform\n  version: "%s"\n' "$VERSION" > syft-config.yaml
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .venv/lib
          config: syft-config.yaml
          format: cyclonedx-json
          output-file: ${{ env.SBOM_FILE }}
          upload-artifact: false
          upload-release-assets: false
      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.prep-release.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: package-dist
          path: dist
      # Signed statement that this SBOM describes the published wheel and sdist
      - name: Attest the SBOM of the package
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          sbom-path: ${{ env.SBOM_FILE }}
      - name: Create release in GitHub
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prep-release.outputs.semver_tag }}
          name: ${{ needs.prep-release.outputs.semver_tag }}
          body: "(this is a placeholder, it will be replaced with a changelog contents)"
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.SBOM_FILE }}
          artifactContentType: application/vnd.cyclonedx+json
          artifactErrorsFailBuild: true
          # On a rerun the release already exists: replace the SBOM asset but keep the
          # release body (the changelog is pasted in by hand), name, draft and prerelease state
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true

  publish-to-pypi:
    name: Publish PyPI
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
      # Publishing to PyPI cannot be undone, so it waits for the GitHub release and its SBOM
      - publish-to-github
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gitlabform
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.semver_tag }}
          fetch-depth: 2
      - name: Configure uv environment
        uses: ./.github/actions/setup-uv-local
        with:
          python-version: "3.14"
      - name: Setup Python ${{ env.UV_PYTHON }} and install dependencies
        run: |
          uv sync --frozen --no-dev --group release
      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.prep-release.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: package-dist
          path: dist
      # Writes <dist>.publish.attestation files, which uv publish uploads along with the files
      - name: Sign the package (PEP 740 attestations)
        run: |
          uv run --no-sync pypi-attestations sign dist/*.whl dist/*.tar.gz
      - name: Publish to PyPI
        run: |
          uv run --no-sync glf-dev release pypi

  publish-to-ghcr:
    name: Publish GHCR
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sigstore signing and the GitHub attestation store
      id-token: write
      attestations: write
    steps:
      # TODO: In a separate PR, optimize docker image build to consume the built package artifact
      # (package-dist) instead of copying and rebuilding from source if applicable.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.semver_tag }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          # Get the ref and the sha from the checked out context - e.g. semver tag rather than triggering branch
          context: git
          images: |
            ghcr.io/gitlabform/gitlabform
          flavor: |
            latest=auto
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # gitlabform/gitlabform image is going to be here
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # This token is provided by Actions, you do not need to create your own token
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker image will use UV internally and builds the image from the Codebase at the current tag, rather than downloding from PyPi
      - name: Publish image to registries
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # Attach an SBOM and full build provenance to the image index in GHCR
          sbom: true
          provenance: mode=max
      # The buildx attestations above are unsigned. The steps below add Sigstore-signed ones,
      # pushed next to the image and stored on GitHub. Storage records are a separate feature
      # that needs the artifact-metadata permission, so they are off.
      - name: Attest build provenance of the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/gitlabform/gitlabform
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # Reuse the SPDX SBOM that buildx made per platform, and attest each one against the
      # digest of the platform manifest it describes
      - name: Extract the platform SBOMs from the image index
        id: sboms
        env:
          IMAGE: ghcr.io/gitlabform/gitlabform@${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            docker buildx imagetools inspect "$IMAGE" \
              --format "{{ json (index .SBOM \"${platform}\").SPDX }}" > "sbom-${arch}.spdx.json"
            test -s "sbom-${arch}.spdx.json"
            digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{ json .Manifest }}' \
              | jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest')
            test -n "$digest"
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done
      - name: Attest the SBOM of the linux/amd64 image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/gitlabform/gitlabform
          subject-digest: ${{ steps.sboms.outputs.amd64 }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the SBOM of the linux/arm64 image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/gitlabform/gitlabform
          subject-digest: ${{ steps.sboms.outputs.arm64 }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
