name: Releases
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Manual Release: {0}', inputs.manual_tag)
    || format('Release: {0}', github.event.workflow_run.display_title) }}

on:
  # Trigger A: Automatic execution when Main Workflow finishes
  workflow_run:
    workflows: ["Main branch"]
    types:
      - completed
  
  # Trigger B: Manual execution fallback from the GitHub UI
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Tag to release (e.g., v1.2.3)'
        required: true
        type: string
      override_run_id:
        description: 'Main Workflow Run ID (Required if downloading artifacts)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  prep-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      is_valid_release: ${{ steps.validate.outputs.is_valid }}
      semver_tag: ${{ steps.validate.outputs.version }}
      target_run_id: ${{ steps.validate.outputs.run_id }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Configure uv environment
        uses: ./.github/actions/setup-uv-local
        with:
          python-version: "3.14"
      - name: Validate release conditions
        id: validate
        env:
          # Authentication Token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upstream Workflow Configuration
          # This is the name of the workflow that both manual and automated
          # release validations depend on.
          UPSTREAM_WORKFLOW_NAME: "Main branch"
          # GitHub Context Variables (provided by the workflow_run or workflow_dispatch event)
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          AUTOMATED_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          # Manual Trigger Inputs (from workflow_dispatch)
          MANUAL_RELEASE_TAG: ${{ inputs.manual_tag }}
          MANUAL_UPSTREAM_RUN_ID: ${{ inputs.override_run_id }}
        run: uv run glf-dev release gh-workflow-check

  publish-to-ghcr-main:
    name: Publish GHCR from main build
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Main branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set SHA tags
        id: meta
        run: |
          echo "full_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Download docker image artifacts (amd64)
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: docker-image-amd64
          path: .docker
      - name: Download docker image artifacts (arm64)
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: docker-image-arm64
          path: .docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push arch-specific images and create multi-arch manifest
        run: |
          set -euo pipefail
          FULL_SHA=${{ steps.meta.outputs.full_sha }}
          SHORT_SHA=${{ steps.meta.outputs.short_sha }}
          for TAR in .docker/docker-image-*.tar; do
            echo "Loading $TAR"
            IMAGE_REF=$(docker load --input "$TAR" | sed -n 's/Loaded image: //p')
            echo "Loaded: $IMAGE_REF"
            ARCH=$(basename "$TAR" | sed -E 's/^docker-image-(.*)\.tar$/\1/')
            TARGET_ARCH_TAG_FULL=${IMAGE_BASE}:sha-${FULL_SHA}-${ARCH}
            TARGET_ARCH_TAG_SHORT=${IMAGE_BASE}:sha-${SHORT_SHA}-${ARCH}
            echo "Tagging $IMAGE_REF -> $TARGET_ARCH_TAG_FULL"
            docker tag "$IMAGE_REF" "$TARGET_ARCH_TAG_FULL"
            echo "Pushing $TARGET_ARCH_TAG_FULL"
            docker push "$TARGET_ARCH_TAG_FULL"
            echo "Also tagging $IMAGE_REF -> $TARGET_ARCH_TAG_SHORT"
            docker tag "$IMAGE_REF" "$TARGET_ARCH_TAG_SHORT"
            echo "Pushing $TARGET_ARCH_TAG_SHORT"
            docker push "$TARGET_ARCH_TAG_SHORT"
          done

          echo "Creating multi-arch manifest: sha-${FULL_SHA}"
          docker buildx imagetools create --tag ${IMAGE_BASE}:sha-${FULL_SHA} \
            ${IMAGE_BASE}:sha-${FULL_SHA}-amd64 \
            ${IMAGE_BASE}:sha-${FULL_SHA}-arm64

          echo "Creating multi-arch manifest: sha-${SHORT_SHA}"
          docker buildx imagetools create --tag ${IMAGE_BASE}:sha-${SHORT_SHA} \
            ${IMAGE_BASE}:sha-${SHORT_SHA}-amd64 \
            ${IMAGE_BASE}:sha-${SHORT_SHA}-arm64

          echo "Creating multi-arch manifest: latest"
          docker buildx imagetools create --tag ${IMAGE_BASE}:latest \
            ${IMAGE_BASE}:sha-${SHORT_SHA}-amd64 \
            ${IMAGE_BASE}:sha-${SHORT_SHA}-arm64

          echo "Published commit image tags for ${FULL_SHA} (short: ${SHORT_SHA})"

  publish-docs:
    name: Publish Docs
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.semver_tag }}
          fetch-depth: 2
      - name: Download built documentation
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.prep-release.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: docs-site
          path: site
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: site

  publish-to-github:
    name: Publish Release
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
    runs-on: ubuntu-latest
    steps:
      - name: Create release in GitHub
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.prep-release.outputs.semver_tag }}
          name: ${{ needs.prep-release.outputs.semver_tag }}
          body: "(this is a placeholder, it will be replaced with a changelog contents)"
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-to-pypi:
    name: Publish PyPI
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gitlabform
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.semver_tag }}
          fetch-depth: 2
      - name: Configure uv environment
        uses: ./.github/actions/setup-uv-local
        with:
          python-version: "3.14"
      - name: Setup Python ${{ env.UV_PYTHON }} and install dependencies
        run: |
          uv sync --frozen --no-dev --group release
      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.prep-release.outputs.target_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: package-dist
          path: dist
      - name: Publish to PyPI
        run: |
          uv run --no-sync glf-dev release pypi

  publish-to-ghcr-release:
    name: Publish GHCR (release)
    if: ${{ needs.prep-release.outputs.is_valid_release == 'true' }}
    needs:
      - prep-release
      - publish-to-pypi
      - publish-to-ghcr-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep-release.outputs.semver_tag }}
          fetch-depth: 2
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ${{ env.IMAGE_BASE }}
          flavor: |
            latest=auto
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source image exists before promotion
        run: |
          set -euo pipefail
          SOURCE=${IMAGE_BASE}:sha-${{ needs.prep-release.outputs.head_sha }}
          echo "Checking source image: ${SOURCE}"
          docker buildx imagetools inspect "$SOURCE" >/dev/null
      - name: Promote image to release tags
        run: |
          set -euo pipefail
          SOURCE=ghcr.io/gitlabform/gitlabform:sha-${{ needs.prep-release.outputs.head_sha }}
          echo "Promoting ${SOURCE} to:"
          echo "${{ steps.metadata.outputs.tags }}"
          TAGS=${{ steps.metadata.outputs.tags }}
          FLAG_ARGS=""
          for t in $TAGS; do
            FLAG_ARGS="$FLAG_ARGS --tag $t"
          done
            docker buildx imagetools create $FLAG_ARGS $SOURCE
          echo "Updating 'latest' to point to promoted release image"
          docker buildx imagetools create --tag ${IMAGE_BASE}:latest $SOURCE
